[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iclass-api-py"
version = "0.1.0"
description = "Python API client library for TronClass / iClass"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "python-dateutil>=2.8.2",
    "beautifulsoup4>=4.12.0",
]

[tool.setuptools.packages.find]
include = ["*"]
